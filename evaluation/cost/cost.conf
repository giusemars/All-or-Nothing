# cost.conf - settings of the cost evaluation, read by run_cost.sh (shell
# syntax). A setting also given in the environment overrides this file:
#   RUNS=4 evaluation/cost/run_cost.sh

# Results directory, relative to the repository top. Empty:
# evaluation/results/cost-<branch>-<commit>. An existing directory is
# appended to (its runs are numbered on), so running again on the same
# commit adds runs to the same results.
OUT=

RUNS=1                 # runs made by this invocation (a run = P0..P3 once)
GAMMA=0.01             # batch means: target relative half-width of each CI
MAXN=256554432          # batch means: cap on the calls of a configuration (32 Mi)
MAXN_DEFENDED=256554432 # the cap for bench_defended and P0 ud2 (~20 us per call)
CPU=2                  # CPU the measured processes are pinned to
OWNER=                 # uid:gid that gets the results (empty: who ran the script)
QUIET=1                # seconds of pause before each configuration

# P1/P2 write sizes. 0 is write(-1, buf, 0) (-EBADF, the worst case of the
# relative overhead); every SIZE > 0 adds a pass of the four builds making
# real writes of SIZE bytes (at most 1 MiB) to the file SINK, rewound with
# lseek (outside the timed window) before it would grow past MAX_FILE_SIZE.
SIZES="0 64 4096 65536"
SINK=/dev/shm/aon_bench # tmpfs: page-cache copy only, no writeback or journal
MAX_FILE_SIZE=1048576  # bytes (1 MiB)

# Batch means (batch_means.py); empty = its default, in brackets.
WARMUP=1000            # d: observations discarded first [1000]
N0=25600               # initial n, a multiple of K_TEST and K_FINAL [25600]
K_TEST=400             # batches of the independence test [400]
K_FINAL=20             # batches of the confidence interval [20]
RHO=0.2                # rho*: max lag-1 autocorrelation of the test batch means [0.2]
ALPHA=0.05             # 1 - confidence level: 0.05 = 95% CI [0.05]
